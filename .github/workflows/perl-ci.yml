---
# Created by App::GHGen::PerlCustomizer
name: Perl CI

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        perl:
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
        exclude:
          - os: windows-latest
            perl: "5.40"
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        id: setup-perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: ${{ matrix.perl }}

      - name: Get exact Perl binary version for cache key
        id: perl-version
        shell: perl {0}
        run: |
          use Config;
          my @paths = ($^X);
          if ($^O eq 'MSWin32' && $Config{libperl}) {
              (my $dir = $^X) =~ s{[\\/][^\\/]+$}{};
              my $dll = "$dir/$Config{libperl}";
              push @paths, $dll if -f $dll;
          }
          my $sum = 0;
          for my $path (@paths) {
              open(my $fh, '<:raw', $path) or next;
              $sum += unpack('%32C*', $_) while read $fh, $_, 65536;
          }
          open(my $out, '>>', $ENV{GITHUB_OUTPUT}) or die $!;
          print $out "version=$Config{version}-$Config{archname}-$sum\n";

      - name: Cache CPAN modules
        uses: actions/cache@v6
        with:
          path: ~/perl5
          key: ${{ runner.os }}-perl-${{ steps.perl-version.outputs.version }}-${{ hashFiles('cpanfile') }}
          restore-keys: |
            ${{ runner.os }}-perl-${{ steps.perl-version.outputs.version }}-

      - name: Install cpanm and local::lib
        if: runner.os != 'Windows'
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install cpanm and local::lib (Windows)
        if: runner.os == 'Windows'
        run: cpanm --notest App::cpanminus local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        if: runner.os == 'Linux'
        run: |
           sudo apt update
           sudo apt install libdb-dev libperl-dev
      - name: Install dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest --installdeps --verbose .

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "PATH=%USERPROFILE%\perl5\bin;%PATH%"
          set "PERL5LIB=%USERPROFILE%\perl5\lib\perl5"
          cpanm --notest --installdeps --verbose .

      - name: Reinstall YAML::XS against current Perl (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cpanm --notest --reinstall YAML::XS

      - name: Lint and syntax check
        shell: perl {0}
        run: |
          use strict;
          use warnings;
          use File::Find;
          my @failed;
          # Every module these files use resolves to a stub, so what this step
          # catches is a file that will not compile: a missing or misspelled
          # dependency is for the installer and the tests to catch, not here.
          # lib is not put on @INC either: each module is compiled from its own
          # file, once, by the loop below.
          push @INC, sub { open my $h, '<', \qq{1;\n}; $h };
          my @dirs = grep { -d } qw(lib bin);
          @dirs = ('.') unless @dirs;
          my $checked = 0;
          find({ wanted => sub {
              return unless -f && /\.pm$/;
              my $file = $File::Find::name;
              $checked++;
              # "./" so that perl compiles this file.  A bare relative path is
              # looked for in @INC, where the stub answers for every name, so
              # `do $file` returned "1;" for each module and read none of them
              # - a sweep that passed whatever the modules said.  "./" is not
              # searched for in @INC, so do() has to open the real file.
              my $compiled = do "./$file";
              if ($@) {
                  warn "Syntax check failed: $file\n";
                  push @failed, $file;
              } elsif (!defined $compiled) {
                  # do() answered undef with nothing in $@: the file was not
                  # read at all, which must not count as a pass either.
                  warn "Could not compile $file\n";
                  push @failed, $file;
              }
          }, no_chdir => 1 }, @dirs);

          # A sweep that found nothing is not an all-clear.  A lib/ that has
          # moved, or a filter that matches nothing, would otherwise report
          # the same success as a tree of clean modules.
          if($checked) {
              print "Syntax checked $checked module(s)\n";
          } else {
              warn "Nothing under @dirs to syntax check\n";
              push @failed, 'no modules';
          }

          if (($ENV{RUNNER_OS} // '') eq 'Linux') {
              # A finding fails the step, as it does for the two -c -Mwarnings::unused
              # checks in the Linux workflow, and a sweep that did not run to
              # completion is not an all-clear.  As a pipeline with grep at the end,
              # and no pipefail to carry prove's status, a broken sweep looked
              # exactly like a clean t/.
              if (system('cpanm --notest --quiet warnings::unused') != 0) {
                  warn "warnings::unused: could not be installed, so t/ went unswept\n";
                  push @failed, 'warnings::unused';
              } else {
                  my $sweep = `PERL5OPT=-Mwarnings::unused prove -lr t/ 2>&1`;
                  my $status = $?;
                  my @unused = grep { /unused/i } split(/\n/, $sweep);
                  if (@unused) {
                      warn "$_\n" for @unused;
                      warn "warnings::unused: unused variables in t/\n";
                      push @failed, 't/';
                  } elsif ($status != 0) {
                      my $why = ($status & 127) ? 'signal ' . ($status & 127) : 'exit ' . ($status >> 8);
                      warn "warnings::unused: the sweep did not run to completion (prove: $why)\n";
                      warn $sweep;
                      push @failed, 't/';
                  } else {
                      print "warnings::unused: no unused variables detected\n";
                  }
              }
          }

          exit(@failed ? 1 : 0);

      - name: Run tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          prove -lr t/

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "PATH=%USERPROFILE%\perl5\bin;%PATH%"
          set "PERL5LIB=%USERPROFILE%\perl5\lib\perl5"
          prove -lr t/

      - name: Run Perl::Critic
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest Perl::Critic
          # A finding at severity 5 - perlcritic's default, and the level
          # .perlcriticrc is written for - fails the build.  lib/ is clean at
          # that level, so this is a check that can fail rather than a report:
          # severity 3 has 178 findings that predate this workflow, and gating
          # on those would fail every run.
          perlcritic --severity 5 lib/
        shell: bash

      - name: Perl::Critic report (advisory)
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest Perl::Critic
          # Advisory, so it cannot fail the build and cannot vouch for the
          # tree: it is here to show the debt that severity 3 finds.  What
          # stood here before was `perlcritic --severity 3 lib/ || true` in a
          # continue-on-error step, so a crash and a run with 178 findings
          # both looked like a pass; a finding now shows as a failed,
          # tolerated step.
          perlcritic --severity 3 lib/
        shell: bash

      - name: Check imports with perlimports
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest App::perlimports
          # A gate, not a report: perlimports --lint exits non-zero when it
          # would change a file, and that status is the step's, so a suggestion
          # fails the build.  Every module in lib/ is clean at this severity --
          # the advice it gave has been taken -- so a failure here is a new one.
          # There is no handler on the command and no continue-on-error above
          # to turn that failure into a pass.
          #
          # --no-padding because this tree writes its import lists as
          # qw(foo), never qw( foo ): the check holds the imports, it does not
          # restyle them.
          find lib -name '*.pm' | xargs perlimports --lint --no-padding
        shell: bash

      - name: Test coverage
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest Devel::Cover
          cover -delete
          HARNESS_PERL_SWITCHES=-MDevel::Cover prove -lr t/
          cover
        shell: bash

      - name: Show cpanm build log on failure (Windows)
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: Get-Content "$env:USERPROFILE\.cpanm\work\*\build.log" -Tail 100

      - name: Show cpanm build log on failure (non-Windows)
        if: runner.os != 'Windows' && failure()
        run: |
          # The wildcard is unquoted so that the shell expands it, and the count is
          # given as -n 100: inside double quotes the * stays literal, and tail
          # rejects -100 outright as soon as there is more than one build log,
          # so either way the diagnostic printed nothing at all.
          tail -n 100 $HOME/.cpanm/work/*/build.log
