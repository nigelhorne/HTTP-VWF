---
name: Linux
permissions:
  contents: read
on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
  pull_request:

jobs:
  perl:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        perl-version:
          - "latest"

    container:
      image: perl:${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v7
      - name: perl -V
        run: perl -V
      - name: Update
        run: |
          apt update -q -y
          apt upgrade -y
          apt dist-upgrade -y
          apt install libdbd-csv-perl -y
      - name: Install Dependencies
        run: |
          cpanm -iqn File::Spec ExtUtils::MakeMaker XML::LibXML
          cpanm -iqfn CGI::IDS Data::Throttler CGI::ACL
          # A failed install fails the step: the build log explains it, and the
          # cat's own success must not swallow it.
          cpanm --skip-satisfied -qn Database::Abstraction Log::WarnDie CGI::Lingua FCGI::Buffer || { cat /github/home/.cpanm/work/*/build.log; exit 1; }
          cpanm --skip-satisfied -qn String::Random Log::Dispatch::File Class::Simple Taint::Runtime
          cpanm --skip-satisfied -qn LWP::UserAgent::Cached LWP::Simple::WithCache Data::Serializer CGI::Carp B::Lint FCGI Template::Plugin::EnvHash HTML::SocialMedia Error IPC::System::Simple
          cpanm --skip-satisfied -qn Template::Plugin::JSON Log::Any::Adapter::Log4perl XML::Simple CHI DBD::CSV
          # warnings::unused is here because the step below runs it against
          # page.fcgi and against every module under lib/; without it those
          # checks could only report their own absence.
          cpanm --skip-satisfied -qn warnings::unused File::HomeDir Config::Abstraction Template::Filters Carp::Always Test::Mockingbird JSON::MaybeXS
          # Mail::DKIM is only recommended, but installing it here is what makes
          # t/mail.t test the signature instead of skipping that subtest.
          cpanm --skip-satisfied -qn Crypt::URandom File::pfopen Timer::Simple File::Slurp Mail::DKIM
          cpanm --skip-satisfied -qn Filesys::Df Sys::MemInfo Sys::Uptime System::Info Data::Validate::URI Params::Validate::Strict HTML::D3 DateTime Time::Duration::Parse
          cpanm --skip-satisfied -qn Test::Most Readonly IP::Country::Fast CGI::Info~1.14
          # Makefile.PL's TEST_REQUIRES, which the manual list above does not
          # read.  Without Test::Returns, t/function.t dies on its own use line
          # before it runs a single test.
          cpanm --skip-satisfied -qn Test::Returns Test::Memory::Cycle HTTP::Response File::Copy::Recursive YAML Test::Pod Test::Pod::Coverage
      - name: Run Tests
        run: |
          # The whole suite, so a test added later is covered here without
          # anyone having to remember to list it.  No root_dir is set: it would
          # override the settings in a configuration file.
          #
          # t/example-site.t renders example/cgi-bin/page.fcgi, and t/version.t
          # keeps the module versions, Changes and the README in step.
          prove -l t/
          # page.fcgi lives in the example site, not at the repository root.
          # -Ilib is needed because the distribution itself is not installed,
          # only its dependencies are.
          # The two lint checks are on what perl said, not on what perl's exit
          # status was.  B::Lint and warnings::unused report what they find as
          # warnings, and a warning leaves the status at 0: `perl -c -MO=Lint`
          # answered 0 here while printing six findings, so a check that only
          # looked at the status could never fail.  What a clean run prints is
          # "syntax OK" and nothing else.
          # warnings::unused 0.06 cannot read the signature parameters that
          # 5.44 compiles to state lexicals: it reports every one of them as
          # unused, used or not.  Only that shape is dropped; a plain "my"
          # variable is still a finding.
          no_findings() {
                  said=$("$@" 2>&1) || { printf '%s\n' "$said" >&2; return 1; }
                  if found=$(printf '%s\n' "$said" | grep -v -e 'syntax OK$' -e '^$' -e 'Unused variable state \$'); then
                          printf '%s\n' "$said" >&2
                          return 1
                  fi
                  printf '%s\n' "$said"
          }
          # undefined-subs is off: it reports `close STDERR` and
          # `open(STDERR, ...)` as calls to subroutines called close and open
          # that do not exist - six times over this script - so left on it
          # would fail every run rather than catch anything.
          no_findings perl -Ilib -c -MO=Lint,no-undefined-subs example/cgi-bin/page.fcgi ''
          no_findings perl -Ilib -c -Mwarnings::unused example/cgi-bin/page.fcgi ''
          # Every module as well, not only the ones page.fcgi loads.  Its use
          # lines compile a handful of them, but the page modules are required
          # at run time, from the pages a configuration names, so a variable
          # nothing uses in one of those was never compiled under
          # warnings::unused and never reported.  Each module is compiled on its
          # own, with lib/ in front so that a module's own use lines resolve to
          # the files in this checkout.  A clean run prints only "syntax OK",
          # which is not worth a line of log per module, so those are dropped and
          # the count is reported instead.  A finding still reaches the log with
          # the file and line in it - the helper writes it to stderr, which the
          # redirect does not touch - and fails the step.
          modules_checked=0
          for module in $(find lib -name '*.pm' | sort); do
                  no_findings perl -Ilib -c -Mwarnings::unused "$module" > /dev/null
                  modules_checked=$((modules_checked + 1))
          done
          # A sweep that found nothing is not an all-clear: lib/ that has moved,
          # or a find that matches nothing, would otherwise report the same
          # success as a tree of clean modules.
          if [ "$modules_checked" -eq 0 ]; then
                  echo 'Nothing under lib/ to check with warnings::unused' >&2
                  exit 1
          fi
          echo "warnings::unused: $modules_checked module(s) under lib/ have no unused variables"
          # get_params and get_template_path used to be separate test files;
          # both are subtests of t/function.t now, which prove -l t/ above ran.
      - name: Install a headless browser for the chart test
        env:
          # Both sides are pinned: the test asserts that this browser drew
          # marks with this D3, so a silent upgrade of either could change
          # what is being tested.  Debian drops superseded chromium packages,
          # so an install failure here means bumping these deliberately.
          CHROMIUM_VERSION: '156.0.8078.79-1~deb13u1'
          D3_VERSION: '7.9.2'
          D3_SHA256: '912111098ea99503a6f4967361d2bbdc9dbf58cf9c678c8e27e5b02d1a07f0c1'
        run: |
          # chromium is the browser the test drives; the fonts give its axis
          # labels something to draw with.  The test skips without a browser,
          # so installing it here is what makes the DOM check run at all.
          apt update -q -y
          DEBIAN_FRONTEND=noninteractive apt install -y "chromium=${CHROMIUM_VERSION}" fonts-dejavu-core curl
          chromium --version
          # The page names the same D3 the template loads, saved at the version
          # above.  Fetching it once here means a CDN hiccup cannot look like a
          # chart that failed to draw, and the checksum makes a changed file a
          # failure rather than something that quietly runs.
          curl -fsSL "https://cdn.jsdelivr.net/npm/d3@${D3_VERSION}/dist/d3.min.js" -o /tmp/d3.v7.min.js
          echo "${D3_SHA256}  /tmp/d3.v7.min.js" | sha256sum -c -
      - name: Draw the meta_data charts in a real browser
        env:
          D3_URL: file:///tmp/d3.v7.min.js
        run: prove -l t/meta-data-charts.t
